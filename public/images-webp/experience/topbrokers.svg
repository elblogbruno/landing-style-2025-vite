<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tbAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tbGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#tbBg)" />
  <rect x="2" y="2" width="116" height="116" rx="22" fill="none" stroke="#334155" stroke-width="2" />
  
  <!-- Network / Brokerage Grid Lines -->
  <path d="M25 85 L45 60 L70 72 L95 38" fill="none" stroke="url(#tbGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="25" cy="85" r="3.5" fill="#38bdf8" />
  <circle cx="45" cy="60" r="3.5" fill="#38bdf8" />
  <circle cx="70" cy="72" r="3.5" fill="#60a5fa" />
  <circle cx="95" cy="38" r="4.5" fill="#38bdf8" />
  
  <!-- Monogram TB -->
  <text x="60" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="900" font-size="34" fill="url(#tbAccent)" text-anchor="middle" letter-spacing="-1">TB</text>
  <text x="60" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">TOPBROKERS</text>
</svg>
