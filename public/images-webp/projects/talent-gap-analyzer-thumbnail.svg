<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="tgaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tgaCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#tgaBg)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#f59e0b" stroke-width="1">
    <circle cx="300" cy="180" r="60" fill="none" />
    <circle cx="300" cy="180" r="120" fill="none" />
    <circle cx="300" cy="180" r="180" fill="none" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="0" y1="180" x2="600" y2="180" />
  </g>

  <!-- Winner Banner Badge -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Trophy Icon -->
    <path d="M22 10 L22 17 C22 21 18 24 14 24 C10 24 6 21 6 17 L6 10 Z" fill="url(#goldGradient)" transform="translate(10, 0) scale(0.8)" />
    <path d="M4 12 C2 12 1 14 1 16 C1 18 3 20 6 20" fill="none" stroke="#fbbf24" stroke-width="1.5" transform="translate(10, 0) scale(0.8)" />
    <path d="M24 12 C26 12 27 14 27 16 C27 18 25 20 22 20" fill="none" stroke="#fbbf24" stroke-width="1.5" transform="translate(10, 0) scale(0.8)" />
    <text x="45" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#fef08a" letter-spacing="1">WINNER — UAB THE HACK 2025</text>
  </g>

  <g transform="translate(370, 32)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="90" y="19" font-family="sans-serif" font-weight="700" font-size="11" fill="#cbd5e1" text-anchor="middle">Collaborative Team Project</text>
  </g>

  <!-- Workforce Intelligence Radar / Graph Card -->
  <rect x="50" y="80" width="500" height="200" rx="16" fill="url(#tgaCard)" stroke="#374151" stroke-width="1.5" />

  <!-- Radar skill graph -->
  <polygon points="170,125 220,150 200,210 140,210 120,160" fill="#3b82f6" fill-opacity="0.35" stroke="#60a5fa" stroke-width="2" />
  <polygon points="170,140 205,160 190,195 150,195 135,170" fill="#f59e0b" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Center point -->
  <circle cx="170" cy="175" r="4" fill="#60a5fa" />
  <text x="170" y="115" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Technical</text>
  <text x="235" y="155" font-family="sans-serif" font-size="10" fill="#94a3b8">Leadership</text>
  <text x="210" y="230" font-family="sans-serif" font-size="10" fill="#94a3b8">Systems</text>
  <text x="125" y="230" font-family="sans-serif" font-size="10" fill="#94a3b8">Analysis</text>
  <text x="95" y="165" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">Strategy</text>

  <!-- AI Workforce Multi-Provider LLM Pipeline on the right -->
  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="240" height="40" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1" />
    <text x="15" y="24" font-family="monospace" font-size="11" fill="#60a5fa">Multi-LLM Router</text>
    <text x="145" y="24" font-family="monospace" font-size="10" fill="#10b981">GPT-4 / Claude / Gemini</text>

    <rect x="0" y="52" width="240" height="40" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1" />
    <text x="15" y="76" font-family="monospace" font-size="11" fill="#fbbf24">Skill Gap Analysis</text>
    <text x="145" y="76" font-family="monospace" font-size="10" fill="#94a3b8">Role Compatibility</text>

    <rect x="0" y="104" width="240" height="40" rx="8" fill="#111827" stroke="#10b981" stroke-width="1" />
    <text x="15" y="128" font-family="monospace" font-size="11" fill="#34d399">Bias Detection &amp; Audit</text>
    <text x="175" y="128" font-family="monospace" font-size="10" fill="#a5b4fc">Cached &amp; Tracked</text>
  </g>

  <!-- Main Title & description -->
  <text x="50" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">TalentGapAnalyzer</text>
  <text x="50" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">AI Workforce Intelligence &amp; Skill-Gap Platform</text>

  <!-- Badges -->
  <g transform="translate(50, 365)">
    <rect x="0" y="0" width="85" height="22" rx="6" fill="#1e293b" stroke="#374151" />
    <text x="42" y="15" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle">Multi-LLM</text>

    <rect x="93" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#374151" />
    <text x="123" y="15" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Python</text>

    <rect x="161" y="0" width="65" height="22" rx="6" fill="#1e293b" stroke="#374151" />
    <text x="193" y="15" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">FastAPI</text>

    <rect x="234" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#374151" />
    <text x="264" y="15" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="middle">Pandas</text>

    <rect x="302" y="0" width="85" height="22" rx="6" fill="#1e293b" stroke="#374151" />
    <text x="344" y="15" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">Scikit-learn</text>

    <rect x="395" y="0" width="55" height="22" rx="6" fill="#1e293b" stroke="#374151" />
    <text x="422" y="15" font-family="monospace" font-size="10" fill="#f43f5e" text-anchor="middle">React</text>
  </g>
</svg>
