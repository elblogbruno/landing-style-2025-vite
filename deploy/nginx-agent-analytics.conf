# Classifies requests made by AI agents so nginx can report them to Umami.
#
# Umami only counts page views sent by its browser script. Agents never run that script,
# and Umami's /api/send drops bot user agents anyway, so llms.txt, the Markdown copies and
# profile.json never showed up in the stats. The `mirror` in nginx-agent-mirror.conf
# sends one Umami event per request that this file flags.
#
# Maps must live in the http context, which HestiaCP domain includes cannot reach.
# Install as /etc/nginx/conf.d/agent-analytics.conf (see deploy/README.md).

# Known AI crawlers and agent fetchers. Captures the product token.
map $http_user_agent $ai_agent {
    default "";
    "~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|Claude-SearchBot|Claude-Web|anthropic-ai|PerplexityBot|Perplexity-User|Google-Extended|GoogleAgent-[A-Za-z]+|Gemini-Deep-Research|Applebot-Extended|meta-externalagent|meta-externalfetcher|Amazonbot|CCBot|Bytespider|cohere-ai|MistralAI-User|DuckAssistBot|YouBot|Diffbot)" $1;
}

# The files that exist only for agents. Whoever fetches them counts, whatever the UA says.
map $request_uri $agent_file {
    default 0;
    "~^/(en/)?(index\.md|profile\.json|llms(-full)?\.txt|resume\.md|projects\.md|about\.txt)(\?|$)" 1;
}

map $http_accept $agent_wants_md {
    default 0;
    "~*text/markdown" 1;
}

# Track when any of the three applies: "00" means agent file 0, no known UA, no Markdown.
map "$agent_file$ai_agent$agent_wants_md" $agent_track {
    "00"    0;
    default 1;
}

# Event name: the known agent, or the UA's first token (curl, python-requests, axios...).
map $http_user_agent $agent_ua_token {
    default "unknown";
    "~^([A-Za-z0-9][A-Za-z0-9._-]{0,39})" $1;
}
map $ai_agent $agent_label {
    ""      $agent_ua_token;
    default $ai_agent;
}

# nginx cannot JSON-escape, so the values put into the event body keep only characters that
# need no escaping. A truncated UA or path still identifies the hit.
map $http_user_agent $agent_ua {
    default "";
    "~^([A-Za-z0-9 ._/;:()+,=-]{1,200})" $1;
}
map $request_uri $agent_path {
    default "/";
    "~^([A-Za-z0-9/._~%-]{1,200})" $1;
}
