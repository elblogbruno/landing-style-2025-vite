# Installed ONLY as /home/admin/conf/web/brunomoya.com/nginx.ssl.conf_agentanalytics:
# plain-HTTP page requests get a 301 from Apache and come back over HTTPS, so mirroring
# port 80 too would count them twice. Umami runs on this host (docker, port 3005).
#
# AI agent hits -> Umami, in real time. $agent_track and the other variables come from
# /etc/nginx/conf.d/agent-analytics.conf. Set at server level so it also covers what nginx
# proxies to Apache (the .md/.json files and `Accept: text/markdown` on / and /en/). nginx
# only mirrors main requests, so /_agent_hit does not mirror itself, and its response is
# discarded: a slow or down Umami never changes what the agent receives.
# ponytail: nginx re-mirrors after an internal redirect (error_page, @fallback), so a 404 on
# a static extension counts twice. Real files and Apache-served paths count once.
mirror /_agent_hit;

location = /_agent_hit {
    internal;
    access_log off;
    if ($agent_track = 0) {
        return 204;
    }

    proxy_pass http://127.0.0.1:3005/api/send;
    proxy_method POST;
    proxy_pass_request_headers off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
    proxy_set_header Content-Type "application/json";
    # Umami's bot check drops any request whose User-Agent looks like a bot, which is every
    # one of these. The agent's real UA goes in the event name and data instead; the ip
    # field keeps the agent's location and session. The website is a dedicated "agents" site
    # so this fixed browser UA never mixes with human visits.
    proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36";
    proxy_set_body '{"type":"event","payload":{"website":"1c2d97e9-53be-4984-95a5-3af0dd305e6c","hostname":"brunomoya.com","url":"$agent_path","name":"$agent_label","ip":"$remote_addr","data":{"ua":"$agent_ua","markdown":$agent_wants_md}}}';
}
