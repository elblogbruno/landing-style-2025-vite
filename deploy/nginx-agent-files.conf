# Cache lifetime for the agent-facing text files.
#
# The HestiaCP nginx template serves every PROXY EXT match straight off disk with
# `expires max`, and `txt` is on that list. That gave /robots.txt, /llms.txt and
# /llms-full.txt a ten-year Cache-Control, so any proxy or scanner that fetched them once
# would never see an update: isitagentready.com read a cached /robots.txt and reported no
# Content Signals hours after they were live. These files state policy and index the site,
# so a stale copy is worse than a slow one.
#
# `location =` (exact match) is deliberate. A server-level regex loses to the template's
# `expires max` block, which is nested inside `location /`; an exact match has the highest
# priority in nginx and wins outright. The server block has no root of its own - only that
# nested location does - so it has to be repeated here.
#
# This is a HestiaCP `conf_*` include, which v-rebuild-web-domains preserves, so it needs no
# template fork. Installed as BOTH of these, see deploy/README.md:
#   /home/admin/conf/web/brunomoya.com/nginx.conf_agentfiles
#   /home/admin/conf/web/brunomoya.com/nginx.ssl.conf_agentfiles

location = /robots.txt {
    root    /home/admin/web/brunomoya.com/public_html;
    expires 10m;
}

location = /llms.txt {
    root    /home/admin/web/brunomoya.com/public_html;
    expires 10m;
}

location = /llms-full.txt {
    root    /home/admin/web/brunomoya.com/public_html;
    expires 10m;
}

location = /about.txt {
    root    /home/admin/web/brunomoya.com/public_html;
    expires 10m;
}
