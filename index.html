    <!-- Prevenir flash de tema incorrecto -->
    <script>
      // Aplicar tema inmediatamente para evitar flash
      (function() {
        // Lets CSS tell a page without JavaScript apart (see awards-room.css).
        document.documentElement.classList.add('js');
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        // Detectar idioma basado en la URL y actualizar el atributo lang
        const path = window.location.pathname;
        if (path.includes('/en')) {
          document.documentElement.lang = 'en';
        } else {
          document.documentElement.lang = 'es';
        }
      })();
    </script>
