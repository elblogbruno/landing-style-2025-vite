    <script>
      // Aplicar tema inmediatamente para evitar flash
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        // Detectar idioma basado en la URL y actualizar el atributo lang
        const path = window.location.pathname;
        if (path.includes('/en')) {
          document.documentElement.lang = 'en';
        } else {
          document.documentElement.lang = 'es';
        }
      })();
    </script>

    <!-- PROFESSIONAL_FALLBACK_START --><div id="root"></div><noscript><main><article><h1>Bruno Moya: I turn emerging technology into real products.</h1><p>Founder &amp; CEO at Glassear · CTO at TopBrokers</p><p>Software engineer and technical product builder based in Barcelona. Founder &amp; CEO of Glassear, optical see-through AR powered by smartphones, and CTO at TopBrokers, working across AI systems, spatial computing, hardware and production infrastructure.</p><p>I started programming at 13. In 2015, still a teenager, I started building Glassear because I wanted AR glasses I couldn't buy. Glassear needed hardware, so I learned hardware; it needed computer vision, so I learned computer vision. Later came backend, infrastructure and AI. The technologies changed; the habit didn't: pick a hard problem, build it, break it, understand why, and build it again until it works outside a demo.</p><section><h2>What I'm building</h2><article><h3><a href="https://www.glassear.com/">Glassear</a> - Founder &amp; CEO (since 2015)</h3><p>Optical see-through AR hardware that uses the user's smartphone as display and compute (Glassear One, patent pending), Glassear Studio (an AI-native platform for creating spatial apps) and GlassMusic, its first real use case.</p><ul><li>Glassear One — AR hardware</li><li>Glassear Studio — spatial creation with AI</li><li>GlassMusic — first vertical product</li></ul></article><article><h3><a href="https://topbrokers.io/">TopBrokers</a> - CTO (since 2025)</h3><p>AI, automation, backend systems and production infrastructure for a real estate technology platform.</p></article><article><h3><a href="https://github.com/elblogbruno">Experiments</a> - Side projects &amp; hackathons</h3><p>Side projects and hackathons such as MapAnim, a browser-based editor for animated travel maps, and TalentGapAnalyzer, winner of UAB The Hack 2025, plus XR, computer vision and hardware work.</p><ul><li>MapAnim — an animated-map editor with video export</li><li>TalentGapAnalyzer — UAB The Hack 2025 winner</li><li>+ XR, computer vision and hardware</li></ul></article></section><section><h2>Milestones</h2><ul><li><time datetime="2015">2015</time> - Started building Glassear.</li><li><time datetime="2018">2018</time> - Glassear received the 2nd Professional Prize at Maker Faire Galicia.</li><li><time datetime="2023">2023</time> - Graduated in Computer Science from Universitat Autònoma de Barcelona, after a term at ÉTS Montréal.</li><li><time datetime="2025-03">2025-03</time> - GlassMusic, the first Glassear use case, shown at 4YFN / Mobile World Congress 2025 with UAB.</li><li><time datetime="2025-04">2025-04</time> - TalentGapAnalyzer won UAB The Hack 2025.</li><li><time datetime="2025">2025</time> - Glassear selected for the ACCIÓ Catalan Pitch Competition 2025 catalogue of 50 Catalan startups with the most potential (Deep Tech).</li><li><time datetime="2025-11">2025-11</time> - Became CTO at TopBrokers.io.</li><li><time datetime="2026-03-04">2026-03-04</time> - Pitched GlassMusic by Glassear at 4YFN / MWC 2026 on the Catalan Arts stand; visitors tried Glassear One.</li></ul></section><section><h2>How I think</h2><article><h3>AI should do things, not just talk about them.</h3><p>It gets interesting when a model can use real tools, change a real scene or call a real API, with deterministic checks around it deciding what actually happens.</p></article><article><h3>The prototype is where the real work starts.</h3><p>Making something work once is a demo. Making it work on an ordinary Tuesday, for someone else, with bad Wi-Fi, is a product.</p></article><article><h3>I like owning the whole problem.</h3><p>Frontend, backend, hardware, AI or infrastructure are implementation choices. If it's part of the product, it's part of the problem.</p></article><article><h3>Emerging tech gets interesting when it stops feeling emerging.</h3><p>AR and AI don't matter because they're new. They matter the day a musician reads a score hands-free, or a team stops doing something by hand.</p></article></section><section><h2>Current work</h2><article><h3>CTO - TopBrokers.io</h3><time datetime="2025-11">2025-11 - Present</time><p>Hands-on technical ownership of an AI- and automation-driven real estate technology platform, from architecture and implementation to deployment and operations.</p></article><article><h3>Founder &amp; CEO - Glassear</h3><time datetime="2015-05">2015-05 - Present</time><p>Founded Glassear in 2015 and kept iterating the device for a decade across optics, mechanics, electronics and software. Glassear now builds an AR / spatial computing ecosystem: Glassear One hardware, the Glassear Studio platform and GlassMusic.</p></article></section><section><h2>Selected projects</h2><article><h3><a href="/projects/jobagent/">JobAgent - Autonomous AI Job Search &amp; Application System</a></h3><p>An autonomous, agentic job-search platform for role discovery, semantic matching, job analysis, CV tailoring and controlled browser-assisted applications.</p></article><article><h3><a href="/projects/talent-gap-analyzer/">TalentGapAnalyzer - AI Workforce Intelligence</a></h3><p>AI-powered workforce intelligence and talent gap analysis platform built as a team project at UAB The Hack 2025.</p></article><article><h3><a href="/projects/glassear-studio/">Glassear Studio - Natural Language to Interactive XR</a></h3><p>Glassear Studio translates natural-language intent into structured, synchronized changes to interactive XR applications.</p></article><article><h3><a href="/projects/mapanim/">MapAnim — Route Motion Studio</a></h3><p>A browser-based editor for animated travel maps, with an editable itinerary, camera controls, a timeline, map styles and MP4 export.</p></article></section><p><a href="/resume/">View Bruno Moya's resume</a> - <a href="mailto:bruno@glassear.com">Contact Bruno Moya</a></p></article></main></noscript><!-- PROFESSIONAL_FALLBACK_END -->
